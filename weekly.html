<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Weekly</title>
    <link rel="icon" type="image/png" href="/imgs/favicon.png">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/global.css"> 
    <link rel="stylesheet" href="/templates/header.css">
    <link rel="stylesheet" href="/css/weekly.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
</head>
<body class="auth-loading">

    <div id="header-placeholder"></div>

    <main class="weekly-container">

        <header class="weekly-header">
            <h1 class="weekly-logo">weekly.</h1>
            <h3 class="weekly-slogan">O JORNAL SEMANAL DA COMPANHIA DOS PROFESSORES</h3>
            <p class="weekly-intro">
                As novidades mais quentes e os bastidores da nossa Companhia.
            </p>
        </header>

        <div id="current-edition-view" class="fade-transition">
            <div class="edition-grid">
                <div class="left-panel-details">
                    <div class="badge-status">NOVA EDIÇÃO</div>
                    <h2 id="current-volume">Carregando...</h2>
                    <p id="current-date" class="edition-date"></p>
                    <p id="current-description" class="edition-description"></p>
                    
                    <a id="current-link" href="#" target="_blank" class="btn btn-primary btn-cta">
                        LER EDIÇÃO AGORA
                    </a>
                </div>
                <div class="right-panel" id="current-image-panel">
                    </div>
            </div>

            <div class="archive-trigger">
                <button id="show-past-btn" class="btn-link">
                    <i class="fa-solid fa-clock-rotate-left"></i> Ver volumes anteriores
                </button>
            </div>
        </div>

        <div id="past-editions-view" class="hidden fade-transition">
            <div class="section-header">
                <h2 class="section-title">ARQUIVO HISTÓRICO</h2>
                <div class="section-divider"></div>
            </div>
            
            <div id="past-editions-list" class="past-list-grid">
                </div>

            <div class="archive-trigger">
                <button id="back-to-current-btn" class="btn-link">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para a edição atual
                </button>
            </div>
        </div>

    </main>
    
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/global.js" defer></script> 
    <script src="/js/weekly.js" defer></script>
</body>
</html>
