<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Ranking Interno</title>
    <link rel="icon" type="image/png" href="/imgs/favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/global.css"> 
    <link rel="stylesheet" href="/css/ranking.css"> 
    <link rel="stylesheet" href="/templates/header.css"> 
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
</head>
<body class="auth-loading">

    <div id="header-placeholder"></div>

    <main class="ranking-page">
        
        <div class="page-header" style="text-align: center; margin-bottom: 2rem; margin-top: 2rem;">
            <h1 class="page-title" style="color: #fff; font-weight: 800; font-size: 2.5rem;">
                <i class="fa-solid fa-trophy" style="color: #f1c40f;"></i> RANKING INTERNO
            </h1>
            <p class="page-subtitle" style="color: #cfaadb; font-size: 1.1rem;">RANKING INTERNO PARA PROFESSOR DO MÊS</p>
        </div>

        <nav class="ranking-nav">
            <a href="#podium-secao" class="nav-item"><i class="fa-solid fa-medal"></i> PÓDIO GERAL</a>
            <a href="#ranking-detalhado" class="nav-item"><i class="fa-solid fa-list-ol"></i> CLASSIFICAÇÃO COMPLETA</a>
            <a href="https://docs.google.com/spreadsheets/d/1qL4S-vNDI2iONCVtl6fUuWo6EK0v62IWFGydrLKhlbQ/edit?gid=135616877#gid=135616877" target="_blank" class="nav-item external-link-icon"><i class="fa-solid fa-file-excel"></i>TRANSPARÊNCIA</a>
        </nav>

        <section id="podium-secao" class="podium-section">
            <div class="section-header">
                <h2 id="ranking-title">Carregando ranking...</h2>
                <div class="section-divider"></div>
            </div>

            <div class="podium-container">
                <div class="podium-item podium-2 modern-card glass-podium silver-glow">
                    <h4>2º Lugar</h4>
                    <div class="podium-avatar"><img id="winner-2-avatar" src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=place.holder&size=l" alt="2º Lugar"></div>
                    <p id="winner-2-nick" class="p-name">...</p>
                    <p id="winner-2-points" class="p-points">...</p>
                </div>

                <div class="podium-item podium-1 modern-card glass-podium gold-glow">
                    <i class="fa-solid fa-crown gold-crown"></i>
                    <h4>1º Lugar</h4>
                    <div class="podium-avatar"><img id="winner-1-avatar" src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=place.holder&size=l" alt="1º Lugar"></div>
                    <p id="winner-1-nick" class="p-name">...</p>
                    <p id="winner-1-points" class="p-points">...</p>
                </div>

                <div class="podium-item podium-3 modern-card glass-podium bronze-glow">
                    <h4>3º Lugar</h4>
                    <div class="podium-avatar"><img id="winner-3-avatar" src="https://www.habbo.com.br/habbo-imaging/avatarimage?user=place.holder&size=l" alt="3º Lugar"></div>
                    <p id="winner-3-nick" class="p-name">...</p>
                    <p id="winner-3-points" class="p-points">...</p>
                </div>
            </div>
        </section>

        <section id="ranking-detalhado" class="detailed-ranking">
            <div class="section-header">
                <h2>CLASSIFICAÇÃO GERAL</h2>
                <div class="section-divider"></div>
            </div>
            
            <div class="ranking-table-container modern-card">
                <table class="nexus-table">
                    <thead>
                        <tr>
                            <th style="width: 20%; text-align: center;">Posição</th>
                            <th style="width: 50%;">Membro</th>
                            <th style="width: 30%; text-align: right;">Pontuação</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-tbody">
                        <tr><td colspan="3" style="text-align: center; color: #fff;">Buscando dados no servidor...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js"></script>
    <script src="/js/loader.js"></script>
    <script src="/js/global.js" defer></script> 
    <script src="/js/ranking.js" defer></script>
    <script src="/js/online-status.js" defer></script>
</body>
</html>
