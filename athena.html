<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Athena IA</title>

    <link rel="icon" type="image/png" href="/imgs/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/templates/header.css">
    <link rel="stylesheet" href="/css/griffoia.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
</head>
<body class="auth-loading">

    <div id="header-placeholder"></div>

    <main class="central-wrapper">
        
        <header class="central-header">
            <div class="tag-duvidas">
                <i class="fa-regular fa-comment-dots"></i> Dúvidas Frequentes
            </div>
            
            <h1>ATHENA IA</h1>
            <p class="subtitle">Tire suas dúvidas com a nossa Inteligência Artificial.</p>
        </header>

        <div class="chat-container">
            
            <div class="messages-area" id="chat-feed" aria-live="polite">
                <div class="message-row system">
                    <div class="avatar-holder">
                        <img src="/imgs/iaprof.png" alt="Avatar Athena IA">
                    </div>
                    <div class="bubble-group">
                        <div class="bubble">
                            Oi, sou a Athena, a IA da Companhia dos Professores.
                            <br><br>
                            Estou pronta para tirar suas dúvidas sobre a Companhia. Como posso ajudar?
                        </div>
                        <div class="meta-info">Athena</div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="user-input" placeholder="Digite sua dúvida aqui..." autocomplete="off" aria-label="Digite sua mensagem para a Athena">
                <button id="send-btn" aria-label="Enviar mensagem">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>

        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js" defer></script>

    <script src="/js/loader.js" defer></script>
    <script src="/js/global.js" defer></script> 
    <script src="/js/griffoia.js" defer></script>
</body>
</html>
