<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>NEXUS - Mural de Fotos</title>

    <link rel="icon" type="image/png" href="/imgs/favicon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/templates/header.css">
    <link rel="stylesheet" href="/css/mural.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>
</head>
<body class="auth-loading">

    <div id="header-placeholder"></div>

    <main class="galeria-container">
        <div class="galeria-header">
            <h1 class="glow-title">Mural de Fotos</h1>
            <p class="subtitle-text">Todos os momentos registrados pelos nossos membros.</p>
            
            <button id="showAddPhotoModalBtn" class="btn-add-photo" aria-label="Adicionar nova foto">
                <span class="material-symbols-outlined">add_a_photo</span>
                ADICIONAR FOTO
            </button>
        </div>

        <div id="photoGrid" class="photo-grid-full"> 
            <div id="loading-wrapper" class="loading-wrapper">
                <i class="fas fa-circle-notch fa-spin fa-3x pulse-icon"></i>
                <p class="loading-text">Revelando fotos...</p>
            </div>
        </div>
    </main>

    <!-- Modal Adicionar Foto -->
    <div id="addPhotoModal" class="modal-overlay hidden">
        <div class="modal-container">
            <button id="close-modal-btn" class="modal-close-btn" aria-label="Fechar modal">&times;</button>
            <h2>Nova Foto</h2>
            <p>Insira o link da imagem, sua legenda e marque quem estava lá.</p>
            
            <form id="add-photo-form">
                <div class="form-group">
                    <label for="photo-url">URL da Imagem</label>
                    <input type="url" id="photo-url" class="nexus-input" placeholder="Ex: https://i.imgur.com/..." required>
                </div>
                
                <div class="form-group">
                    <label for="photo-description-input">Legenda</label>
                    <textarea id="photo-description-input" class="nexus-input" placeholder="O que aconteceu nesse dia? @NomeDoMembro" maxlength="200"></textarea>
                </div>

                <!-- O CAMPO DE MARCAÇÕES VOLTOU AQUI -->
                <div class="form-group">
                    <label for="photo-tags-input">Membros na Foto (Opcional)</label>
                    <input type="text" id="photo-tags-input" class="nexus-input" placeholder="Ex: Sr.Gabriel., Looysx, _:_Wanderson_:">
                </div>
                
                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn-outline">Cancelar</button>
                    <button type="submit" class="btn-primary">Publicar Foto</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Visualizar Foto e Comentários -->
    <div id="photoViewModal" class="modal-overlay hidden">
        <button class="modal-close-btn" id="close-view-modal-btn" aria-label="Fechar modal" style="top: 20px; right: 30px; z-index: 10000; font-size: 3rem;">&times;</button>
        
        <div class="photo-view-container">
            <!-- Lado Esquerdo: A Foto Maior -->
            <div class="photo-view-left">
                <img id="viewModalImage" src="" alt="Visualização da Foto">
            </div>
            
            <!-- Lado Direito: Comentários e Interações -->
            <div class="photo-view-right">
                <div class="photo-view-header">
                    <div class="author-info">
                        <div class="post-author-head">
                            <img id="viewModalAuthorImage" src="" alt="Autor da foto">
                        </div>
                        <div style="display: flex; flex-direction: column;">
                            <a id="viewModalAuthor" href="#" class="author-name">Nome</a>
                            <span id="viewModalDesc" style="font-size: 0.85rem; color: #ccc; font-weight: normal; margin-top: 4px;"></span>
                            <div id="viewModalTags" style="margin-top: 5px;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="photo-view-comments" id="viewModalComments">
                    <div class="loading-comments">Carregando comentários...</div>
                </div>
                
                <div class="photo-view-footer">
                    <div class="photo-view-actions" style="margin-bottom: 15px;">
                        <div id="viewModalLikeBtn" class="like-button" role="button" data-liked="false" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <svg width="28" height="28" viewBox="0 0 24 24" fill="transparent" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.2s ease;">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            <span class="like-count" style="font-size: 16px; font-weight: 700;">0</span>
                        </div>
                    </div>
                    
                    <form id="comment-form" class="comment-input-area">
                        <input type="text" id="comment-input" placeholder="Adicione um comentário... (use @ para marcar)" autocomplete="off">
                        <button type="submit" id="send-comment-btn">Publicar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js" defer></script>

    <script src="/js/loader.js" defer></script>
    <script src="/js/global.js" defer></script> 
    <script src="/js/mural.js" defer></script> 
</body>
</html>
